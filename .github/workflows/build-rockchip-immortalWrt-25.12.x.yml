name: Build R2S ImmortalWrt 25.12.x

# =========================================================
# NanoPi R2S 专用构建工作流 (25.12.x / apk)
#
# 目标机型：FriendlyARM NanoPi R2S (Rockchip RK3328 / ARM64)
# 本分支(main)为 R2S 专用：机型固定，且
#   - 不集成 Docker
#   - 不集成 store / istore 商店
#   - 不克隆任何第三方插件仓库
#   - 不使用 PPPoE 拨号
# 第三方包仅来自 build.sh 中注入的 dllkids（kenzok8）源（down.dllkids.xyz）。
#
# 网络模型：R2S 的 WAN 口接上级设备，默认采用【DHCP】接入（与 ImmortalWrt 官方
#          默认一致）；如需固定地址，把 wan_proto 选为 static 改为静态 IP 接入。
#          WAN6 保持 DHCPv6，以便从上级获取 IPv6 前缀委派（PD）——但注意：wan6
#          由官方 config_generate 只在 dhcp 分支生成，**static 分支不生成 wan6**
#          （WAN 无 IPv6），详见下方 Create info 步骤与 README。
# =========================================================

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择 luci 版本"
        required: false
        default: "25.12.2"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
      custom_router_ip:
        description: "R2S 管理地址(LAN) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.2.1"
      rootfs_partsize:
        description: "软件包空间大小"
        required: true
        type: choice
        default: "1G"
        options:
          - "1G"
          - "2G"
          - "3G"
          - "4G"
      wan_proto:
        description: "WAN 接入方式（dhcp 为官方默认，static 为静态 IP）"
        required: true
        type: choice
        default: "dhcp"
        options:
          - dhcp
          - static
      wan_ip:
        description: "WAN 静态 IP（仅 wan_proto=static 时生效）"
        required: false
        default: "192.168.1.2"
      wan_gateway:
        description: "WAN 网关（仅 wan_proto=static 时生效，如上级光猫 192.168.1.1）"
        required: false
        default: "192.168.1.1"
      wan_dns:
        description: "WAN DNS（仅 wan_proto=static 时生效，留空则用网关；可空格分隔填多个）"
        required: false
        default: "192.168.1.1"

permissions:
  contents: write

# 同一时间只跑一个构建：Release 固定复用 tag `Autobuild`，
# 并发触发会互相覆盖产物，因此串行化。
concurrency:
  group: r2s-immortalwrt-build
  cancel-in-progress: false

# R2S 专用：目标机型固定，不再由用户选择
env:
  PROFILE: "friendlyarm_nanopi-r2s"

jobs:
  build:
    # ubuntu-22.04 已于 2026-09 进入 GitHub 退役流程（deprecated），
    # 用 ubuntu-latest（当前为 24.04）避免 brownout 期构建随机失败。
    runs-on: ubuntu-latest

    # 用户输入统一经 env 中转，**不要**把 ${{ inputs.* }} 直接拼进 shell/heredoc：
    # 输入含 " / $( ) / ; 时可注入命令。经 env 传递后仅作为环境变量值参与，
    # 不进入 shell 解析；再配合下面的格式校验，注入面即被消除。
    env:
      IN_LUCI_VERSION: ${{ inputs.luci_version }}
      IN_ROUTER_IP: ${{ inputs.custom_router_ip }}
      IN_ROOTFS_PARTSIZE: ${{ inputs.rootfs_partsize }}
      IN_WAN_PROTO: ${{ inputs.wan_proto }}
      IN_WAN_IP: ${{ inputs.wan_ip }}
      IN_WAN_GATEWAY: ${{ inputs.wan_gateway }}
      IN_WAN_DNS: ${{ inputs.wan_dns }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/rockchip/build.sh

      - name: Save Custom Router IP into ImmortalWrt files
        run: |
          # 格式校验：仅接受 192.168.x.y 或 10.x.y.z（各段 0–255），非法直接失败。
          OCT='(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])'
          if ! printf '%s' "$IN_ROUTER_IP" | grep -Eq "^192\.168\.${OCT}\.${OCT}$|^10\.${OCT}\.${OCT}\.${OCT}$"; then
            echo "Error: custom_router_ip 格式不合法：$IN_ROUTER_IP（应为 192.168.x.y 或 10.x.y.z）"
            exit 1
          fi
          mkdir -p "${{ github.workspace }}/custom"
          printf '%s\n' "$IN_ROUTER_IP" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "R2S 管理地址:$IN_ROUTER_IP"

      - name: Validate WAN Inputs
        run: |
          if [[ "$IN_WAN_PROTO" == "static" ]]; then
            if [[ -z "$IN_WAN_IP" || -z "$IN_WAN_GATEWAY" ]]; then
              echo "Error: wan_proto=static 时 wan_ip 与 wan_gateway 均为必填项！"
              exit 1
            fi
            # wan_ip / wan_gateway 必须为合法 IPv4；wan_dns 允许留空（留空用网关）
            # 或空格分隔的多个 IPv4。
            OCT='(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])'
            IPV4="^${OCT}\.${OCT}\.${OCT}\.${OCT}$"
            for _v in "$IN_WAN_IP" "$IN_WAN_GATEWAY"; do
              printf '%s' "$_v" | grep -Eq "$IPV4" \
                || { echo "Error: WAN 参数不是合法 IPv4：$_v"; exit 1; }
            done
            for _v in $IN_WAN_DNS; do
              printf '%s' "$_v" | grep -Eq "$IPV4" \
                || { echo "Error: wan_dns 含非 IPv4 值：$_v"; exit 1; }
            done
            echo "WAN 接入方式: static  地址: $IN_WAN_IP  网关: $IN_WAN_GATEWAY  DNS: $IN_WAN_DNS"
          else
            echo "WAN 接入方式: dhcp（官方默认，地址由上级设备分配，无需填写 wan_ip/wan_gateway）"
          fi

      - name: Building R2S ImmortalWrt 25.12.x
        run: |
          rootfs_partsize="$IN_ROOTFS_PARTSIZE"
          case "$rootfs_partsize" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          luci_version="$IN_LUCI_VERSION"
          echo "Building for profile: $PROFILE"
          # ⚠ custom/ 必须挂到 /home/build/immortalwrt/files/etc/immortalwrt-builder/，
          #   不能挂到 .../files/etc/config/：
          #   libuci 会 glob 整个 /etc/config/ 目录，只跳过文件名含 `.` 的条目
          #   （openwrt/uci file.c: get_filename()），其余一律当 uci 配置包解析。
          #   custom_router_ip.txt / wan-settings 这类辅助文件放在 /etc/config/
          #   会让**任何** uci 调用（含 LuCI 软件包页）报
          #       uci: Parse error (invalid command) at line 1, byte 0
          #   详见 rockchip/build.sh 顶部说明。
          docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/immortalwrt-builder" \
              -v "${{ github.workspace }}/rockchip/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/rockchip/build.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE="$PROFILE" \
              -e ROOTFS_PARTSIZE="$ROOTFS_SIZE" \
              -e WAN_PROTO="$IN_WAN_PROTO" \
              -e WAN_IP="$IN_WAN_IP" \
              -e WAN_GATEWAY="$IN_WAN_GATEWAY" \
              -e WAN_DNS="$IN_WAN_DNS" \
          immortalwrt/imagebuilder:rockchip-armv8-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh

      - name: Create info
        run: |
          if [[ "$IN_WAN_PROTO" == "static" ]]; then
            WAN_LINE="- 🌐 **WAN 接入**: 静态 IP $IN_WAN_IP / 网关 $IN_WAN_GATEWAY"
            # 官方 config_generate 只在 dhcp / pppoe 分支生成 wan6，static 分支不生成，
            # 故静态接入时 WAN 无 IPv6（本分支刻意保持官方行为，不补 wan6）。
            WAN6_LINE="- 🧬 **WAN6**: ⚠️ 静态接入下不生成 wan6，WAN 无 IPv6（如需请刷机后在 LuCI 手动添加 wan6：DHCPv6 / eth0）"
          else
            WAN_LINE="- 🌐 **WAN 接入**: DHCP（由上级设备自动分配地址）"
            WAN6_LINE="- 🧬 **WAN6**: DHCPv6（用于获取 PD 前缀）"
          fi
          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 R2S 固件信息

          - ✳️ **机型**: NanoPi R2S (Rockchip RK3328)
          - 🏷️ **Image Builder 版本**: ImmortalWrt $IN_LUCI_VERSION
          - 🏠 **后台地址**: $IN_ROUTER_IP
          ${WAN_LINE}
          ${WAN6_LINE}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          - 🔖 **构建提交**: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - 🔢 **构建序号**: #${{ github.run_number }}
          - 🕒 **构建时间**: ${BUILD_TIME}

          ---

          > ⚠️ 本 Release 的 tag 固定为 \`Autobuild\`，每次构建都会**原地覆盖**附件，
          > 所以这里永远只有最新一份固件。该标签也不会随构建移动，
          > **上面的「构建提交」才是本次固件的真实来源**。
          >
          > 需要**历史版本**请到
          > [Actions](https://github.com/${{ github.repository }}/actions/workflows/build-rockchip-immortalWrt-25.12.x.yml)
          > 页面，点进对应时间的那次运行，在最下方 **Artifacts** 区下载
          > \`r2s-immortalwrt-<版本>-r<序号>\`（保留 90 天）。
          EOF

      # 归档：滚动 Release 只留最新一份，历史版本靠这里的 Artifact。
      # 名字带版本号与 run_number，Actions 页里可区分。
      # retention-days 上限 90（GitHub 默认），如需更长要在仓库设置里改。
      - name: Archive build as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: r2s-immortalwrt-${{ env.IN_LUCI_VERSION }}-r${{ github.run_number }}
          path: ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
          if-no-files-found: error
          retention-days: 90

      # 滚动 Release：供「最新固件」一键下载。
      # tag_name 写死为 Autobuild ⇒ 同 tag 已存在时 action-gh-release 只更新
      # 该 release（overwrite_files 默认 true 覆盖同名附件、append_body 默认
      # false 重写正文），不会新建 tag/release —— 这正是「只有一条 release」
      # 的原因，历史版本请用上面的 Artifact。
      # fail_on_unmatched_files：产物缺失时直接失败，避免发布一个 0 附件的 release。
      - name: Upload ImmortalWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild
          name: ImmortalWrt-R2S
          body_path: ${{ github.workspace }}/router-info.md
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
