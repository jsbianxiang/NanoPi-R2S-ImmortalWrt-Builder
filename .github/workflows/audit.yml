name: Audit Repository Consistency

# =========================================================
# 仓库一致性自检（**只读**：permissions.contents = read）
#
# 起因：2026-10-14 第 3 轮全量审计发现 9 个问题，其中 5 个是
# 「注释里的数字 / 版本声明过期」——改一处忘了同步另外两处，
# 或者源侧数据变了而文档没跟。本工作流把 shell/audit.py 固化进 CI，
# 让这类漂移在 push 时就被发现，而不是等下一次人工审计。
#
# 检查内容见 shell/audit.py 的文件头注释。要点：
#   - 三处代理互斥清单同步（build.sh / README / custom-packages.sh）
#   - _PROXY_OK 白名单三处一致
#   - 工作流输入不直插 shell（${{ inputs.* }} 必须经 env 中转）
#   - 构建期写入路径必须已跟踪或已忽略（防止脏工作区）
#   - 换行符 / shell 语法
#   - 在线：dllkids 与官方源的包数 vs 文档声明、marker 与短名存在性
#   - 在线：**PACKAGES 依赖闭包**（BFS 解 .apk 元数据，查第二个代理前端）
#
# ⚠ 在线检查里「源站不可达」只记为 WARN，不判 FAIL（免得源站抖动就变红）；
#   但源可达而数字对不上，判 FAIL。只取到一个源时，存在性检查同样降级为 WARN
#   —— 缺项可能住在没取到的那个源里（tinyproxy / https-dns-proxy 就在官方
#   luci feed、不在 dllkids），判 FAIL 就是误报。
# ⚠ 依赖闭包那一步要读 100+ 个 .apk 的前 32 KB，慢的时候几分钟；脚本内置
#   CLOSURE_MAX_PKGS / CLOSURE_BUDGET_S 双上限，CI 的 timeout-minutes: 15 够用。
# =========================================================

on:
  workflow_dispatch:
  # 每周一定时在线审计：文档里的源侧数字（dllkids 包数 / 官方源总数）会随上游
  # 源演进而漂移，而 push 触发只在「有人改仓库」时才跑 —— 2026-10-23 那次
  # FAIL（文档 617/409 vs 实测 622/411）就是这么漏过来的。定时跑让「没人动
  # 仓库」时的漂移也在一周内暴露，而不是等下一次人工审计。
  # ⚠ GitHub 对 60 天无提交活动的仓库会停用定时工作流（本仓库活跃，不受影响）；
  #   刻意避开整点：GitHub 官方建议错开 :00，减少定时任务排队。
  schedule:
    - cron: "17 18 * * 1"   # 每周一 18:17 UTC = 北京时间周二 02:17
  push:
    branches:
      - main
    paths:
      - "rockchip/build.sh"
      - "shell/custom-packages.sh"
      - "shell/audit.py"
      - "shell/apkmeta.py"
      - "shell/unpack_fw.py"
      - "README.md"
      - "PACKAGES.md"
      - "files/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "rockchip/build.sh"
      - "shell/custom-packages.sh"
      - "shell/audit.py"
      - "shell/apkmeta.py"
      - "shell/unpack_fw.py"
      - "README.md"
      - "PACKAGES.md"
      - "files/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  audit:
    # 固定 runner 版本，避免 ubuntu-latest 迁移（2026-10-19 → Ubuntu 26）带来的静默漂移。
    runs-on: ubuntu-24.04
    # 20 分钟：正常 1–5 分钟；留的余量是给「源站整体不可达」的最坏情况 ——
    # fetch_retry 每个 URL 最坏约 8 分钟（4 次重试 + http 回退），靠 fetch 缓存
    # 把重复抓取压掉后仍需这个量级，否则超时会把「源站抖动只 WARN」变成红叉。
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 离线检查 + 在线检查一次跑完（在线失败只 WARN，不会掩盖离线结论）。
      - name: Run consistency audit
        run: python3 shell/audit.py --online
