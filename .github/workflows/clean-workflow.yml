name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: "保留最近多少天（默认 90，与构建产物 Artifact 的 90 天保留期对齐）。⚠️ 删除运行记录会连带删除该次运行的 Artifact（构建产物归档）；设为小于 90 会提前销毁尚未自然过期的归档"
        required: false
        default: "90"

jobs:
  cleanup:
    # 固定 runner 版本，避免 ubuntu-latest 迁移（2026-10-19 → Ubuntu 26）带来的静默漂移。
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
      - name: 安装 jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: 删除指定天数前的已完成运行
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ inputs.keep_days }}
        run: |
          : "${KEEP_DAYS:=90}"
          THRESHOLD="$(date -u -d "${KEEP_DAYS} days ago" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "阈值时间(UTC)：$THRESHOLD"

          RUN_IDS=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
                    --paginate -F per_page=100 \
                    --jq '.workflow_runs[]
                          | select(.status=="completed" and .created_at < "'"$THRESHOLD"'")
                          | .id')

          if [ -z "$RUN_IDS" ]; then
            echo "✅ 没有可删除的运行"
            exit 0
          fi

          echo "待删除运行数量：$(wc -w <<< "$RUN_IDS")"
          for ID in $RUN_IDS; do
            echo "🗑 正在删除运行 ID: $ID"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${ID}" || {
              echo "⚠️ 删除失败：$ID（将继续处理其他项）"
            }
            sleep 0.2
          done

          echo "🎉 清理完成"
